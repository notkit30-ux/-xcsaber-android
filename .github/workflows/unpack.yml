name: Unpack project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          zip=""
          for p in xcsaber.zip .github/workflows/xcsaber.zip; do
            if [ -f "$p" ]; then zip="$p"; break; fi
          done
          test -n "$zip" || { echo "::error::xcsaber.zip not found in the repository"; exit 1; }
          echo "Using $zip"
          rm -rf /tmp/unz && mkdir /tmp/unz
          unzip -q "$zip" -d /tmp/unz
          top=$(ls /tmp/unz | head -n 1)
          test -d "/tmp/unz/$top/app" || { echo "::error::The zip does not look like the XCSABER project"; exit 1; }
          rm -rf "/tmp/unz/$top/.github"
          cp -a "/tmp/unz/$top/." .
          rm -f xcsaber.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add XCSABER project files" || { echo "Nothing to commit"; exit 1; }
          git push
